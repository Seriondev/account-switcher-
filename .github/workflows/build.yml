name: Build GUI Account Switcher 1.21.11

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.8

    # ==========================================
    # FILE GRADLE (DIPERBARUI)
    # ==========================================
    - name: Create Gradle Files
      run: |
        mkdir -p src/main/java/com/lite/switcher/gui
        mkdir -p src/main/java/com/lite/switcher/mixin
        mkdir -p src/main/resources
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        rootProject.name = 'lite-account-switcher-1.21.11'
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2G
        org.gradle.parallel=true
        minecraft_version=1.21.11
        yarn_mappings=1.21.11+build.3
        loader_version=0.16.5
        mod_version=2.1.0
        maven_group=com.lite.switcher
        archives_base_name=lite-account-switcher-1.21.11
        fabric_version=0.141.6+1.21.11
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'fabric-loom' version '1.9-SNAPSHOT'
            id 'maven-publish'
        }
        version = project.mod_version
        group = project.maven_group
        base { archivesName = project.archives_base_name }
        repositories {}
        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        }
        processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
                expand "version": project.version
            }
        }
        tasks.withType(JavaCompile).configureEach {
            it.options.release = 21
        }
        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        jar {
            from("LICENSE") {}
        }
        EOF

    # ==========================================
    # ACCOUNT MANAGER
    # ==========================================
    - name: Create Account Manager
      run: |
        cat << 'EOF' > src/main/java/com/lite/switcher/AccountManager.java
        package com.lite.switcher;

        import com.google.gson.Gson;
        import com.google.gson.GsonBuilder;
        import com.google.gson.reflect.TypeToken;
        import net.fabricmc.loader.api.FabricLoader;

        import java.io.File;
        import java.io.FileReader;
        import java.io.FileWriter;
        import java.lang.reflect.Type;
        import java.util.ArrayList;
        import java.util.List;

        public class AccountManager {
            private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
            private static final File FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "lite_accounts.json");
            public static List<String> accounts = new ArrayList<>();
            public static final int MAX_ACCOUNTS = 500;

            public static void load() {
                if (FILE.exists()) {
                    try (FileReader reader = new FileReader(FILE)) {
                        Type listType = new TypeToken<ArrayList<String>>(){}.getType();
                        accounts = GSON.fromJson(reader, listType);
                        if (accounts == null) accounts = new ArrayList<>();
                    } catch (Exception e) { e.printStackTrace(); }
                }
            }

            public static void save() {
                try (FileWriter writer = new FileWriter(FILE)) {
                    GSON.toJson(accounts, writer);
                } catch (Exception e) { e.printStackTrace(); }
            }

            public static boolean add(String name) {
                if (accounts.size() >= MAX_ACCOUNTS || accounts.contains(name) || name.trim().isEmpty()) return false;
                accounts.add(name);
                save();
                return true;
            }

            public static boolean delete(String name) {
                if (accounts.remove(name)) {
                    save();
                    return true;
                }
                return false;
            }

            public static boolean edit(String oldName, String newName) {
                int index = accounts.indexOf(oldName);
                if (index != -1 && !accounts.contains(newName) && !newName.trim().isEmpty()) {
                    accounts.set(index, newName);
                    save();
                    return true;
                }
                return false;
            }
        }
        EOF

    # ==========================================
    # MAIN CLASS
    # ==========================================
    - name: Create Main Class
      run: |
        cat << 'EOF' > src/main/java/com/lite/switcher/LiteAccountSwitcher.java
        package com.lite.switcher;

        import net.fabricmc.api.ClientModInitializer;
        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;

        public class LiteAccountSwitcher implements ClientModInitializer {
            public static final Logger LOGGER = LoggerFactory.getLogger("lite-account-switcher");

            @Override
            public void onInitializeClient() {
                AccountManager.load();
                LOGGER.info("Lite Account Switcher Loaded with {} accounts.", AccountManager.accounts.size());
            }
        }
        EOF

    # ==========================================
    # GUI SCREEN (DIPERBAIKI UNTUK 1.21+)
    # ==========================================
    - name: Create GUI Screen
      run: |
        cat << 'EOF' > src/main/java/com/lite/switcher/gui/AccountSwitcherScreen.java
        package com.lite.switcher.gui;

        import com.lite.switcher.AccountManager;
        import com.lite.switcher.mixin.MinecraftClientAccessor;
        import net.minecraft.client.MinecraftClient;
        import net.minecraft.client.gui.DrawContext;
        import net.minecraft.client.gui.screen.Screen;
        import net.minecraft.client.gui.widget.ButtonWidget;
        import net.minecraft.client.gui.widget.ObjectSelectionList;
        import net.minecraft.client.gui.widget.TextFieldWidget;
        import net.minecraft.client.session.Session;
        import net.minecraft.text.Text;
        import net.minecraft.util.Formatting;

        import java.nio.charset.StandardCharsets;
        import java.util.Optional;
        import java.util.UUID;

        public class AccountSwitcherScreen extends Screen {
            private final Screen parent;
            private AccountListWidget listWidget;
            private TextFieldWidget nameField;
            private String selectedAccount = null;
            private Text statusText = Text.empty();

            public AccountSwitcherScreen(Screen parent) {
                super(Text.literal("Account Switcher"));
                this.parent = parent;
            }

            @Override
            protected void init() {
                this.listWidget = new AccountListWidget(this.client, this.width, this.height, 32, this.height - 64, 24);
                this.addSelectableChild(this.listWidget);

                this.nameField = new TextFieldWidget(this.textRenderer, this.width / 2 - 100, this.height - 50, 200, 20, Text.literal("Nickname"));
                this.nameField.setMaxLength(16);
                this.addDrawableChild(this.nameField);

                this.addDrawableChild(ButtonWidget.builder(Text.literal("Add").formatted(Formatting.GREEN), b -> {
                    if (AccountManager.add(this.nameField.getText())) {
                        this.statusText = Text.literal("Account added!").formatted(Formatting.GREEN);
                        this.listWidget.refreshList();
                    } else {
                        this.statusText = Text.literal("Max 500 or name exists/empty.").formatted(Formatting.RED);
                    }
                }).dimensions(this.width / 2 + 105, this.height - 50, 50, 20).build());

                this.addDrawableChild(ButtonWidget.builder(Text.literal("Edit").formatted(Formatting.YELLOW), b -> {
                    if (selectedAccount != null && AccountManager.edit(selectedAccount, this.nameField.getText())) {
                        this.statusText = Text.literal("Account edited!").formatted(Formatting.GREEN);
                        this.selectedAccount = this.nameField.getText();
                        this.listWidget.refreshList();
                    } else {
                        this.statusText = Text.literal("Select account or invalid edit.").formatted(Formatting.RED);
                    }
                }).dimensions(this.width / 2 + 105, this.height - 28, 50, 20).build());

                this.addDrawableChild(ButtonWidget.builder(Text.literal("Delete").formatted(Formatting.RED), b -> {
                    if (selectedAccount != null && AccountManager.delete(selectedAccount)) {
                        this.statusText = Text.literal("Account deleted!").formatted(Formatting.GREEN);
                        this.selectedAccount = null;
                        this.nameField.setText("");
                        this.listWidget.refreshList();
                    }
                }).dimensions(this.width / 2 + 160, this.height - 28, 50, 20).build());

                this.addDrawableChild(ButtonWidget.builder(Text.literal("Switch Account"), b -> {
                    String nameToSwitch = (selectedAccount != null) ? selectedAccount : this.nameField.getText();
                    if (!nameToSwitch.isEmpty()) {
                        switchAccount(nameToSwitch);
                        this.close();
                    } else {
                        this.statusText = Text.literal("Pilih atau ketik nama akun!").formatted(Formatting.RED);
                    }
                }).dimensions(this.width / 2 - 100, this.height - 28, 100, 20).build());

                this.addDrawableChild(ButtonWidget.builder(Text.literal("Back"), b -> this.close()).dimensions(this.width / 2 + 5, this.height - 28, 50, 20).build());
            }

            private void switchAccount(String name) {
                UUID uuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes(StandardCharsets.UTF_8));
                Session session = new Session(name, uuid, "0", Optional.empty(), Optional.empty());
                ((MinecraftClientAccessor) MinecraftClient.getInstance()).setSession(session);
            }

            @Override
            public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                this.renderBackground(context, mouseX, mouseY, delta);
                this.listWidget.render(context, mouseX, mouseY, delta);
                context.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 10, 0xFFFFFF);
                this.nameField.render(context, mouseX, mouseY, delta);
                context.drawTextWithShadow(this.textRenderer, this.statusText, this.width / 2 - 100, this.height - 62, 0xFFFFFF);
                super.render(context, mouseX, mouseY, delta);
            }

            @Override
            public void close() {
                this.client.setScreen(this.parent);
            }

            public class AccountListWidget extends ObjectSelectionList<AccountListWidget.AccountEntry> {
                public AccountListWidget(MinecraftClient client, int width, int height, int top, int bottom, int itemHeight) {
                    super(client, width, height, top, bottom, itemHeight);
                    refreshList();
                }

                public void refreshList() {
                    this.clearEntries();
                    for (String acc : AccountManager.accounts) {
                        this.addEntry(new AccountEntry(acc));
                    }
                }

                @Override
                public int getRowWidth() { return 300; }

                public class AccountEntry extends ObjectSelectionList.Entry<AccountEntry> {
                    private final String name;
                    public AccountEntry(String name) { this.name = name; }

                    @Override
                    public void render(DrawContext context, int index, int y, int x, int entryWidth, int entryHeight, int mouseX, int mouseY, boolean hovered, float tickDelta) {
                        context.drawTextWithShadow(client.textRenderer, name, x + 5, y + 5, 0xFFFFFF);
                    }

                    @Override
                    public boolean mouseClicked(double mouseX, double mouseY, int button) {
                        AccountListWidget.this.setSelected(this);
                        selectedAccount = this.name;
                        nameField.setText(this.name);
                        return true;
                    }

                    @Override
                    public Text getNarration() { return Text.literal(this.name); }
                }
            }
        }
        EOF

    # ==========================================
    # MIXINS (Accessor & Menu Injection)
    # ==========================================
    - name: Create Mixins
      run: |
        cat << 'EOF' > src/main/java/com/lite/switcher/mixin/MinecraftClientAccessor.java
        package com.lite.switcher.mixin;

        import net.minecraft.client.MinecraftClient;
        import net.minecraft.client.session.Session;
        import org.spongepowered.asm.mixin.Mixin;
        import org.spongepowered.asm.mixin.gen.Accessor;

        @Mixin(MinecraftClient.class)
        public interface MinecraftClientAccessor {
            @Accessor("session")
            void setSession(Session session);
        }
        EOF

        cat << 'EOF' > src/main/java/com/lite/switcher/mixin/TitleScreenMixin.java
        package com.lite.switcher.mixin;

        import com.lite.switcher.gui.AccountSwitcherScreen;
        import net.minecraft.client.gui.screen.Screen;
        import net.minecraft.client.gui.screen.TitleScreen;
        import net.minecraft.client.gui.widget.ButtonWidget;
        import net.minecraft.text.Text;
        import org.spongepowered.asm.mixin.Mixin;
        import org.spongepowered.asm.mixin.injection.At;
        import org.spongepowered.asm.mixin.injection.Inject;
        import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

        @Mixin(TitleScreen.class)
        public abstract class TitleScreenMixin extends Screen {
            protected TitleScreenMixin(Text title) { super(title); }

            @Inject(method = "init", at = @At("RETURN"))
            private void addAccountButton(CallbackInfo ci) {
                this.addDrawableChild(ButtonWidget.builder(Text.literal("Accounts"), b -> {
                    this.client.setScreen(new AccountSwitcherScreen(this));
                }).dimensions(this.width - 110, this.height - 25, 100, 20).build());
            }
        }
        EOF

        cat << 'EOF' > src/main/java/com/lite/switcher/mixin/MultiplayerScreenMixin.java
        package com.lite.switcher.mixin;

        import com.lite.switcher.gui.AccountSwitcherScreen;
        import net.minecraft.client.gui.screen.Screen;
        import net.minecraft.client.gui.screen.multiplayer.MultiplayerScreen;
        import net.minecraft.client.gui.widget.ButtonWidget;
        import net.minecraft.text.Text;
        import org.spongepowered.asm.mixin.Mixin;
        import org.spongepowered.asm.mixin.injection.At;
        import org.spongepowered.asm.mixin.injection.Inject;
        import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

        @Mixin(MultiplayerScreen.class)
        public abstract class MultiplayerScreenMixin extends Screen {
            protected MultiplayerScreenMixin(Text title) { super(title); }

            @Inject(method = "init", at = @At("RETURN"))
            private void addAccountButton(CallbackInfo ci) {
                this.addDrawableChild(ButtonWidget.builder(Text.literal("Accounts"), b -> {
                    this.client.setScreen(new AccountSwitcherScreen(this));
                }).dimensions(this.width / 2 + 154, this.height - 30, 50, 20).build());
            }
        }
        EOF

    # ==========================================
    # RESOURCES (JSON)
    # ==========================================
    - name: Create Resources
      run: |
        cat << 'EOF' > src/main/resources/fabric.mod.json
        {
          "schemaVersion": 1,
          "id": "lite_account_switcher",
          "version": "${version}",
          "name": "Lite Account Switcher GUI",
          "description": "Ganti akun offline langsung dari menu awal.",
          "authors": ["Kamu"],
          "license": "MIT",
          "environment": "client",
          "entrypoints": {
            "client": [
              "com.lite.switcher.LiteAccountSwitcher"
            ]
          },
          "mixins": [
            "lite-account-switcher.mixins.json"
          ],
          "depends": {
            "fabricloader": ">=0.16.0",
            "minecraft": "~1.21",
            "java": ">=21",
            "fabric-api": "*"
          }
        }
        EOF

        cat << 'EOF' > src/main/resources/lite-account-switcher.mixins.json
        {
          "required": true,
          "package": "com.lite.switcher.mixin",
          "compatibilityLevel": "JAVA_21",
          "client": [
            "MinecraftClientAccessor",
            "TitleScreenMixin",
            "MultiplayerScreenMixin"
          ],
          "injectors": {
            "defaultRequire": 1
          }
        }
        EOF

    # ==========================================
    # COMPILE MOD
    # ==========================================
    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lite-Account-Switcher-1.21.11
        path: build/libs/*.jar
